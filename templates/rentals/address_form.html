{% extends "base.html" %}
{% block content %}
<h2 class="mb-1">{{ title }}</h2>
<div class="section-sub mb-4">Müşteri: {{ customer.full_name }}</div>
<form method="post" novalidate>
    {% csrf_token %}
    {% if form.non_field_errors %}
        <div class="alert alert-danger">{% for e in form.non_field_errors %}<div>{{ e }}</div>{% endfor %}</div>
    {% endif %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Kaydet</button>
    <a href="{% url 'rentals:customer_detail' customer.pk %}" class="btn btn-secondary">Vazgeç</a>
</form>
{% endblock %}
