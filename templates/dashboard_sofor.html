{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">Aktif Kiralamalarım</h2>
<div class="panel-card p-3">
    <table class="table app-table mb-0">
        <thead><tr><th>Araç</th><th>Müşteri</th><th>Başlangıç</th><th>Bitiş</th></tr></thead>
        <tbody>
        {% for r in my_rentals %}
            <tr>
                <td>{{ r.vehicle.plate }}</td>
                <td>{{ r.customer.full_name }}</td>
                <td>{{ r.start_date }}</td>
                <td>{{ r.end_date }}</td>
            </tr>
        {% empty %}
            <tr><td colspan="4" class="text-secondary">Aktif kiralamanız yok.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
